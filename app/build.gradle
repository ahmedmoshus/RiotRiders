plugins { id 'com.android.application' }
android {
    namespace 'com.riotriders.game'
    compileSdk 34
    defaultConfig {
        applicationId 'com.riotriders.game'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '4.0'
    }
    signingConfigs {
        // Fixed sideload key kept in the repo so every build can update the previous install.
        sideload {
            storeFile file('sideload.keystore')
            storePassword 'riotriders'
            keyAlias 'riotriders'
            keyPassword 'riotriders'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.sideload }
        release { signingConfig signingConfigs.sideload; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    lint { abortOnError false; checkReleaseBuilds false }
}
