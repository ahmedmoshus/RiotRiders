    else if(d.kind===1)drawRider(sx,sy,ps,{color:e.color,suit:e.suit,helmet:e.helmet,lean:e.lean,atk:e.atk,atkSide:e.atkSide,atkType:e.atkType,weapon:e.weapon,cop:e.cop,boss:e.boss,num:e.cop?undefined:e.i+1,down:e.down>0,tumble:e.down>0?clamp((e.downMax||3)-e.down,0,1):0,night:theme.night});
    else{ctx.globalAlpha=1;pScr.x=sx;pScr.y=sy;pScr.s=ps;if(!(e.inv>0&&Math.floor(frame/4)%2))drawRider(sx,sy,ps,{color:e.bike.color,suit:'#f5f5f5',helmet:'#ffb300',num:'10',lean:e.lean,atk:e.atk,atkSide:e.atkSide,atkType:e.atkType,weapon:e.weapon,down:e.crash>0,tumble:e.crash>0?clamp((2.5-e.crash)/1.1,0,1):0,flame:e.nitroT>0,flash:e.flash>0,night:theme.night,brake:inp.brake})}}}
  ctx.restore()}
 ctx.globalAlpha=1;
 // particles
 for(const q of parts){if(q.life<=0)continue;const a=clamp(q.life/q.max,0,1);
  if(q.star){ctx.fillStyle='#fff';ctx.save();ctx.translate(q.x,q.y);ctx.rotate(frame);const r=q.size*(1.4-a*.6);ctx.beginPath();for(let i=0;i<10;i++){const rr2=i%2?r*.4:r,an=i*.628;ctx.lineTo(Math.cos(an)*rr2,Math.sin(an)*rr2)}ctx.closePath();ctx.fill();ctx.restore();continue}
  if(q.sq){ctx.globalAlpha=a;ctx.fillStyle=q.col;ctx.fillRect(q.x-q.size/2,q.y-q.size/2,q.size,q.size);ctx.globalAlpha=1}
  else{ctx.fillStyle=q.col+(a*.5).toFixed(2)+')';circ(q.x,q.y,q.size*(1.6-a*.8))}}
 // speed + weather
 if(racing){const sr=player.speed/player.bike.top,inten=player.nitroT>0?.4:draft>.5?.22:sr>.92?.1:0;
  if(inten>0&&player.crash<=0){ctx.strokeStyle=`rgba(255,255,255,${inten})`;ctx.lineWidth=2;for(let i=0;i<14;i++){const a=Math.random()*6.28,r1=U*(.5+Math.random()*.5),r2=r1+U*.35;ctx.beginPath();ctx.moveTo(W/2+Math.cos(a)*r1*1.6,H/2+Math.sin(a)*r1);ctx.lineTo(W/2+Math.cos(a)*r2*1.6,H/2+Math.sin(a)*r2);ctx.stroke()}}}
 if(theme.weather==='rain'){ctx.fillStyle='rgba(30,45,60,.14)';ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(205,225,255,.38)';ctx.lineWidth=Math.max(1,U*.004);ctx.beginPath();for(let i=0;i<80;i++){const rx=Math.random()*W*1.2,ry=Math.random()*H,l=U*(.08+Math.random()*.1);ctx.moveTo(rx,ry);ctx.lineTo(rx-l*.35,ry+l)}ctx.stroke()}
 else if(theme.weather==='snow'){ctx.fillStyle='rgba(255,255,255,.85)';for(const f of flakes)circ(f.x*W,f.y*H,f.r*U*.006)}
 else if(theme.weather==='dust'){ctx.strokeStyle='rgba(255,200,150,.12)';ctx.lineWidth=Math.max(1,U*.006);ctx.beginPath();for(let i=0;i<18;i++){const rx=Math.random()*W,ry=Math.random()*H,l=U*(.2+Math.random()*.3);ctx.moveTo(rx,ry);ctx.lineTo(rx+l,ry+l*.05)}ctx.stroke()}
 ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);
 ctx.restore();
 if(racing)drawHUD();
}
function bar(x,y,w,h,v,col,label){ctx.fillStyle='rgba(0,0,0,.6)';rbox(x-2,y-2,w+4,h+4,5);if(v>0){ctx.fillStyle=lg(0,y,0,y+h,shade(col,.25),shade(col,-.2));rbox(x,y,Math.max(h*.6,w*v),h,3)}
 ctx.direction='ltr';ctx.fillStyle='#fff';ctx.font=lang==='ar'?`900 ${h*.8}px Tahoma,Arial,sans-serif`:`900 ${h*.82}px Arial,sans-serif`;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(label,x+6,y+h/2+1)}
function txt(t,x,y,size,col,al){ctx.direction='ltr';ctx.font=FONT(size);ctx.textAlign=al||'left';ctx.textBaseline='top';ctx.lineWidth=Math.max(2,size*.14);ctx.strokeStyle='rgba(0,0,0,.8)';ctx.lineJoin='round';ctx.strokeText(t,x,y);ctx.fillStyle=col;ctx.fillText(t,x,y);return ctx.measureText(t).width}
function drawHUD(){
 const k=Math.max(.55,Math.min(W/1280,H/620)),p=player,m=14*k,ar=lang==='ar';
 const place=1+riders.filter(r=>!r.cop&&(r.finished||r.z>p.z)).length;
 const pw0=txt(T.ord[(p.finished?p.place:place)-1],m,m,(ar?44:54)*k,'#ffb300');txt('/ 10',m+pw0+10*k,m+26*k,22*k,'#fff');
 bar(m,m+70*k,190*k,16*k,p.hp/100,p.hp>35?'#3ecf5a':'#ff453a',T.rider);
 bar(m,m+94*k,190*k,16*k,1-p.dmg/100,p.dmg<65?'#3aa0ff':'#ff9f0a',T.bike);
 if(p.weapon)txt(T[p.weapon],m,m+118*k,20*k,'#ffb300');
 const pw=Math.min(W*.36,460*k),px=W/2-pw/2,py=m+8*k;ctx.fillStyle='rgba(0,0,0,.55)';rbox(px-4,py-4,pw+8,14*k+8,8);ctx.fillStyle='#444';rbox(px,py,pw,14*k,5);
 for(const r of riders){ctx.fillStyle=r.cop?'#39f':r.boss?'#ffd400':r.suit;circ(px+pw*clamp(r.z/finishZ,0,1),py+7*k,(r.boss?5.5:4.5)*k)}
 ctx.fillStyle='#fff';circ(px+pw*clamp(p.z/finishZ,0,1),py+7*k,7*k);ctx.fillStyle='#ffb300';circ(px+pw*clamp(p.z/finishZ,0,1),py+7*k,4.5*k);
 let nr=null,nd=1e9;for(const r of riders){if(r.down>0)continue;const d=Math.abs(r.z-p.z)+Math.abs(r.x-p.x)*400;if(d<700&&d<nd){nd=d;nr=r}}
 if(nr){const bw=200*k;bar(W/2-bw/2,py+30*k,bw,16*k,nr.hp/nr.maxhp,nr.cop?'#3a7bff':nr.boss?'#d7263d':'#e84a5f',nr.name+(nr.weapon?' · '+T[nr.weapon]:''))}
 // right block: speed gauge
 const rx=W-m,my=m+46*(W/innerWidth),sr=clamp(p.speed/(BIKES[4].top*1.25),0,1),gx=rx-62*k,gy=my+58*k,gr=54*k;
 ctx.lineCap='round';ctx.lineWidth=9*k;ctx.strokeStyle='rgba(0,0,0,.55)';ctx.beginPath();ctx.arc(gx,gy,gr,Math.PI*.8,Math.PI*2.2);ctx.stroke();
 ctx.strokeStyle=p.nitroT>0?'#5ff':sr>.8?'#ff453a':'#ffb300';ctx.lineWidth=6*k;ctx.beginPath();ctx.arc(gx,gy,gr,Math.PI*.8,Math.PI*(.8+1.4*sr));ctx.stroke();
 txt(String(Math.round(p.speed/55)),gx,gy-24*k,38*k,'#fff','center');txt(T.kmh,gx,gy+16*k,13*k,'#ddd','center');
 const tt=Math.floor(raceT),ts=String(Math.floor(tt/60))+':'+String(tt%60).padStart(2,'0');txt(ts,rx,my+122*k,22*k,'#fff','right');
 const nn=Math.max(3+save.up.nitro,p.nitro);for(let i=0;i<nn;i++){ctx.fillStyle=i<p.nitro?'#5ff':'rgba(255,255,255,.2)';rbox(rx-(nn-i)*24*k,my+152*k,18*k,10*k,3)}
 txt('+$'+bonus,rx,my+168*k,18*k,'#7CFC8A','right');
 msgs.forEach((ms,i)=>{ctx.globalAlpha=clamp(ms.t,0,1);txt(ms.text,W/2,H*.24+i*34*k,28*k,ms.color,'center');ctx.globalAlpha=1});
 if(state==='count'){const c=Math.ceil(countT-.6);txt(c>0?String(c):T.go,W/2,H*.3,120*k,c>0?'#fff':'#7CFC8A','center')}
 else if(raceT<1)txt(T.go,W/2,H*.3,120*k,'#7CFC8A','center');
 if(p.crash>0&&p.bust)txt(T.busted,W/2,H*.4,80*k,'#6cf','center');
 if(p.finished)txt(T.finish,W/2,H*.36,90*k,'#ffb300','center');
 if(Math.abs(p.x)>1.02&&p.crash<=0)txt(T.offroad,W/2,H*.16,22*k,'#ff9f0a','center');
 else if(track.two&&p.x<-.05&&p.crash<=0&&Math.floor(frame/20)%2)txt(T.oncoming,W/2,H*.16,22*k,'#ff453a','center');
 else if(draft>.5&&p.crash<=0)txt(T.slip,W/2,H*.16,20*k,'#9fe8ff','center');
}

/* ---------- loop ---------- */
let lastT=0,acc=0;
function loop(t){requestAnimationFrame(loop);let dt=Math.min(.1,(t-lastT)/1000||0);lastT=t;acc+=dt;const st=1/60;let n=0;
 while(acc>=st&&n<5){update(st);prev.punch=inp.punch;prev.kick=inp.kick;prev.nitro=inp.nitro;acc-=st;n++}if(n===5)acc=0;
 if(state==='race'||state==='count'||endT>0)skyOff+=segAt(player.z).curve*(player.speed/12000)*.0006;render()}

/* ---------- UI ---------- */
function showScreen(id){document.querySelectorAll('.ov').forEach(o=>o.classList.toggle('on',o.id===id))}
function toMenu(){state='menu';engine(0,false);riders=[];picks=[];$('topbtns').classList.remove('on');$('touch').classList.remove('on');buildTrack(Math.min(save.unlocked-1,TRACKS.length-1));picks=[];camZ=0;refreshHome();showScreen('sHome')}
function refreshHome(){$('homeCash').textContent=T.bank+' $'+save.money+'  ·  '+BIKES[save.bike].name}
function refreshTracks(){$('trackGrid').innerHTML=TRACKS.map((t,i)=>{const open=i<save.unlocked,b=save.best[i],th=THEMES[t.theme];
 return`<div class="card ${open?'':'lock'}"><div class="swatch" style="background:linear-gradient(90deg,${th.sky[0]},${th.sky[2]},${th.grass[0]})"></div><h3>${i+1}. ${T.tracks[i][0]}</h3><div class="sm">${T.tracks[i][1]}</div>
 <div class="lbl"><span>${(t.len/1000).toFixed(1)} km</span><span>${t.cops?t.cops+' '+T.police:T.nopolice}</span><span>${b?T.best+': '+T.ord[b-1]:th.weather?T.weather[th.weather]:'—'}</span></div>
 <button class="btn sm2" data-track="${i}" ${open?'':'disabled'}>${open?T.ride:T.locked}</button></div>`}).join('')}
function refreshGarage(){$('garCash').textContent=T.bank+' $'+save.money;
 $('bikeGrid').innerHTML=BIKES.map((b,i)=>{const own=save.owned.includes(i),sel=save.bike===i,st=(l,v)=>`<div class="lbl"><span>${l}</span></div><div class="bar"><i style="width:${v}%"></i></div>`;
 return`<div class="card ${sel?'sel':''}"><div class="swatch" style="background:${b.color}"></div><h3 dir="ltr">${b.name}</h3><div class="sm">${T.blurbs[i]}</div>
 ${st(T.topspeed+' · '+Math.round(b.top/55)+' '+T.kmh,b.top/15500*100)}${st(T.accel,b.acc/7200*100)}${st(T.handling,b.grip/1.4*100)}
 <button class="btn sm2" data-bike="${i}" ${sel||(!own&&save.money<b.price)?'disabled':''}>${sel?T.riding:own?T.select:T.buy+' $'+b.price}</button></div>`}).join('');
 $('upGrid').innerHTML=UPS.map(u=>{const l=save.up[u.id],mx=l>=3,pr=u.price[l];
 return`<div class="card"><h3>${T.up[u.id][0]}</h3><div class="sm">${T.up[u.id][1]}</div><div class="pips">${[0,1,2].map(i=>`<i class="${i<l?'f':''}"></i>`).join('')}</div>
 <button class="btn sm2" data-up="${u.id}" ${mx||save.money<pr?'disabled':''}>${mx?T.maxed:T.buy+' $'+pr}</button></div>`}).join('')}
$('goRace').onclick=()=>{initAudio();refreshTracks();showScreen('sTracks')};
$('goGarage').onclick=()=>{initAudio();refreshGarage();showScreen('sGarage')};
$('goHelp').onclick=()=>showScreen('sHelp');
$('goLang').onclick=()=>{save.lang=lang==='ar'?'en':'ar';store();setLang(save.lang)};
document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{refreshHome();showScreen('sHome')});
$('trackGrid').onclick=e=>{const b=e.target.closest('[data-track]');if(b&&!b.disabled){initAudio();startRace(+b.dataset.track)}};
$('bikeGrid').onclick=e=>{const b=e.target.closest('[data-bike]');if(!b||b.disabled)return;const i=+b.dataset.bike;if(!save.owned.includes(i)){if(save.money<BIKES[i].price)return;save.money-=BIKES[i].price;save.owned.push(i);sfx.cash()}save.bike=i;store();refreshGarage()};
$('upGrid').onclick=e=>{const b=e.target.closest('[data-up]');if(!b||b.disabled)return;const u=UPS.find(u=>u.id===b.dataset.up),l=save.up[u.id];if(l>=3||save.money<u.price[l])return;save.money-=u.price[l];save.up[u.id]=l+1;sfx.cash();store();refreshGarage()};
let pausedFrom='race';
function pause(){if(state==='race'||state==='count'){pausedFrom=state;state='paused';engine(0,false);showScreen('sPause')}}
$('resume').onclick=()=>{state=pausedFrom;showScreen(null)};
$('restart').onclick=()=>startRace(tIndex);
$('quit').onclick=toMenu;$('resMenu').onclick=toMenu;
$('resRetry').onclick=()=>startRace(tIndex);
$('resNext').onclick=()=>startRace(Math.min(TRACKS.length-1,tIndex+1));
$('bPause').onclick=pause;
$('bMute').onclick=()=>{muted=!muted;if(master)master.gain.value=muted?0:1;$('bMute').style.opacity=muted?.4:1};
$('bFull').onclick=()=>{try{const d=document,el=d.documentElement;if(d.fullscreenElement||d.webkitFullscreenElement)(d.exitFullscreen||d.webkitExitFullscreen).call(d);else{const p=(el.requestFullscreen||el.webkitRequestFullscreen).call(el);if(p&&p.catch)p.catch(()=>{})}}catch(e){}};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
window.rrBack=()=>{if(state==='race'||state==='count'){pause();return true}if(state==='paused'){state=pausedFrom;showScreen(null);return true}if(!$('sHome').classList.contains('on')&&state==='menu'){refreshHome();showScreen('sHome');return true}if(state==='ended'){toMenu();return true}return false};

const KM={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'gas',KeyW:'gas',ArrowDown:'brake',KeyS:'brake',KeyZ:'punch',KeyJ:'punch',KeyX:'kick',KeyK:'kick',Space:'nitro',ShiftLeft:'nitro',ShiftRight:'nitro'};
addEventListener('keydown',e=>{const k=KM[e.code];if(k){inp[k]=1;if(touchMode){touchMode=false;$('touch').classList.remove('on')}e.preventDefault()}
 if(e.code==='KeyP'||e.code==='Escape'){if(state==='paused'){state=pausedFrom;showScreen(null)}else pause()}
 if(e.code==='KeyM')$('bMute').onclick();
 if(e.code==='Enter'&&state==='menu'&&$('sHome').classList.contains('on'))$('goRace').onclick()});
addEventListener('keyup',e=>{const k=KM[e.code];if(k)inp[k]=0});
addEventListener('blur',()=>{for(const k in inp)inp[k]=0});
[['tL','l'],['tR','r'],['tP','punch'],['tK','kick'],['tN','nitro'],['tB','brake']].forEach(([id,k])=>{const el=$(id);
 const dn=e=>{e.preventDefault();inp[k]=1;el.classList.add('dn');try{el.setPointerCapture(e.pointerId)}catch(_){}},up=e=>{e.preventDefault();inp[k]=0;el.classList.remove('dn')};
 el.addEventListener('pointerdown',dn);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up);el.addEventListener('contextmenu',e=>e.preventDefault())});
addEventListener('pointerdown',e=>{if(e.pointerType==='touch'&&!touchMode){touchMode=true;if(state==='race'||state==='count')$('touch').classList.add('on')}});

window.__rr={start:startRace,player,inp,save,setLang,get state(){return state},get riders(){return riders},step:n=>{for(let i=0;i<n;i++){update(1/60);prev.punch=inp.punch;prev.kick=inp.kick;prev.nitro=inp.nitro}render()}};
buildTrack(0);setLang(save.lang||((navigator.language||'').toLowerCase().startsWith('ar')?'ar':'en'));toMenu();requestAnimationFrame(loop);
})();
